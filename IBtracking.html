<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDG&ISG IB物流查询</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh;background:linear-gradient(135deg,#e8eef5 0%,#d4dde8 30%,#a8c4d8 60%,#7ba3c0 100%);display:flex;align-items:flex-start;justify-content:center;padding:20px}
.bg-wrapper{width:100%;max-width:960px;margin-top:30px}
.main-card{background:rgba(255,255,255,.88);backdrop-filter:blur(20px);border-radius:24px;padding:44px 40px;box-shadow:0 8px 32px rgba(0,0,0,.1)}
.title{font-size:28px;font-weight:700;color:#1a2744;margin-bottom:4px}
.subtitle{font-size:14px;color:#6b7a8d;margin-bottom:24px}
.search-section{display:flex;flex-direction:column;gap:12px}
.search-row{display:flex;gap:10px;align-items:center;background:#f5f7fa;border-radius:12px;padding:8px 16px;border:1px solid #e2e8f0;transition:border-color .2s}
.search-row:focus-within{border-color:#3b5998}
.field-label{font-size:14px;font-weight:600;color:#1a2744;min-width:100px;flex-shrink:0}
.search-input{flex:1;border:none;background:transparent;font-size:14px;color:#333;outline:none;padding:8px 0}
.search-input::placeholder{color:#aab5c4}
.search-btn{width:100%;padding:14px;background:#1a2744;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;transition:background .2s,transform .1s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
.search-btn:hover{background:#2c3e6b}
.search-btn:active{transform:scale(.99)}
.search-btn:disabled{background:#8e9db5;cursor:not-allowed}
.loading{text-align:center;padding:20px;color:#6b7a8d;font-size:14px;display:flex;align-items:center;justify-content:center;gap:10px}
.spinner{width:18px;height:18px;border:3px solid #d4dde8;border-top-color:#1a2744;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.result-section{margin-top:28px;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.result-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.result-header span{font-size:14px;color:#1a2744;font-weight:600}
.export-btn{padding:6px 16px;background:#f5f7fa;border:1px solid #d4dde8;border-radius:8px;font-size:12px;color:#3b5998;cursor:pointer;transition:background .2s}
.export-btn:hover{background:#e8eef5}
.table-wrapper{overflow-x:auto;border-radius:12px;border:1px solid #e2e8f0}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{background:#1a2744;color:#fff}
th{padding:12px 10px;text-align:left;white-space:nowrap;font-weight:500}
td{padding:10px;border-bottom:1px solid #f0f2f5;color:#333;white-space:nowrap}
tr:hover td{background:#f8fafc}
.status-open{color:#e67e22;font-weight:600}
.status-close{color:#27ae60;font-weight:600}
.no-result{text-align:center;padding:32px;color:#95a5a6;font-size:14px;margin-top:20px}
.pagination{display:flex;justify-content:center;gap:6px;margin-top:16px}
.page-btn{padding:6px 12px;border:1px solid #d4dde8;background:#fff;border-radius:6px;cursor:pointer;font-size:12px;color:#333;transition:all .15s}
.page-btn:hover{background:#e8eef5}
.page-btn.active{background:#1a2744;color:#fff;border-color:#1a2744}
.page-btn:disabled{opacity:.4;cursor:not-allowed}

/* Floating panel */
.upload-toggle{position:fixed;bottom:16px;right:16px;z-index:100}
.upload-toggle-btn{display:flex;align-items:center;gap:6px;background:#1a2744;color:#fff;border:none;border-radius:20px;padding:8px 16px;font-size:12px;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.2);transition:all .2s}
.upload-toggle-btn:hover{background:#2c3e6b;transform:translateY(-1px)}
.upload-toggle-btn .dot-indicator{width:7px;height:7px;border-radius:50%;background:#d4dde8;flex-shrink:0}
.upload-toggle-btn .dot-indicator.ready{background:#4ade80}
.upload-toggle-btn .dot-indicator.partial{background:#fbbf24}
.upload-panel{position:fixed;bottom:52px;right:16px;z-index:100;background:#fff;border-radius:14px;box-shadow:0 4px 24px rgba(0,0,0,.15);padding:16px;width:300px;display:none;animation:slideUp .2s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.upload-panel.show{display:block}
.panel-title{font-size:13px;font-weight:600;color:#1a2744;margin-bottom:8px}
.panel-info{font-size:11px;color:#6b7a8d;line-height:1.6;margin-bottom:10px}
.panel-info .time{color:#1a2744;font-weight:500}
.panel-divider{height:1px;background:#e2e8f0;margin:10px 0}
.file-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px;color:#6b7a8d}
.file-row .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.file-row .dot.ok{background:#27ae60}
.file-row .dot.none{background:#d4dde8}
.file-row .dot.err{background:#e74c3c}
.file-row .name{flex:1}
.file-row .count{color:#1a2744;font-weight:500}
.refresh-btn{width:100%;margin-top:10px;padding:9px;background:#f5f7fa;border:1px solid #d4dde8;border-radius:8px;font-size:12px;color:#3b5998;cursor:pointer;transition:all .2s;font-weight:500}
.refresh-btn:hover{background:#e8eef5;border-color:#3b5998}
.panel-hint{font-size:10px;color:#95a5a6;margin-top:8px;line-height:1.5}

@media(max-width:640px){.main-card{padding:24px 18px}.title{font-size:22px}.search-row{flex-direction:column;align-items:stretch}.upload-panel{width:calc(100vw - 32px);right:16px}}
</style>
</head>
<body>
<div class="bg-wrapper">
  <div class="main-card">
    <h1 class="title">IDG&ISG IB物流查询</h1>
    <p class="subtitle">输入BOL号码查询货物运输状态</p>
    <div class="search-section">
      <div class="search-row">
        <span class="field-label">BOL Number</span>
        <input type="text" class="search-input" id="searchInput" placeholder="请输入BOL号码" />
      </div>
      <button class="search-btn" id="searchBtn" disabled>查询</button>
    </div>
    <div id="loading" class="loading" style="display:none"><span class="spinner"></span><span id="loadingText">加载中...</span></div>
    <div id="resultSection" class="result-section" style="display:none">
      <div class="result-header">
        <span id="resultCount">查询结果</span>
        <button class="export-btn" id="exportBtn">导出CSV</button>
      </div>
      <div class="table-wrapper">
        <table><thead><tr>
          <th>来源</th><th>BOL Number</th><th>货物状态</th>
          <th>承运商</th><th>Truck Type</th><th>HIC ASN收到时间</th>
          <th>提货时间</th><th>预计到达时间</th><th>实际到达时间</th>
          <th>供应商</th><th>提货城市</th><th>数量</th><th>运输类型</th>
        </tr></thead><tbody id="resultBody"></tbody></table>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
    <div id="noResult" class="no-result" style="display:none">未找到匹配的记录，请检查输入的BOL号码是否正确。</div>
  </div>
</div>

<!-- Floating data source panel -->
<div class="upload-toggle">
  <button class="upload-toggle-btn" id="toggleUpload">
    <span class="dot-indicator" id="dotIndicator"></span>
    <span id="toggleLabel">加载中...</span>
  </button>
</div>
<div class="upload-panel" id="uploadPanel">
  <div class="panel-title">数据源</div>
  <div class="panel-info" id="panelInfo">正在加载...</div>
  <div class="file-row"><span class="dot none" id="dotIDG"></span><span class="name">IDG.csv</span><span class="count" id="countIDG">-</span></div>
  <div class="file-row"><span class="dot none" id="dotISG"></span><span class="name">ISG.csv</span><span class="count" id="countISG">-</span></div>
  <div class="panel-divider"></div>
  <button class="refresh-btn" id="refreshBtn">立即刷新数据</button>
  <div class="panel-hint">数据来源: IDG.csv 和 ISG.csv<br>更新数据请在GitHub仓库中替换CSV文件。</div>
</div>

<script>
// ===== CONFIG: relative paths to CSV files =====
const CSV_FILES = [
  { url: 'IDG.csv', source: 'IDG' },
  { url: 'ISG.csv', source: 'ISG' }
];

// ===== State =====
let DATA = [];
let idgCount = 0, isgCount = 0;
const PAGE_SIZE = 20;
let currentResults = [], currentPage = 1;
let lastLoadTime = null;

// ===== CSV Parsing =====
function parseCSV(text, source) {
  const result = Papa.parse(text, { header: true, skipEmptyLines: true });
  return result.data.map(row => ({
    src: source,
    bol: (row.BOLNumber || '').trim(),
    carrier: row.Carrier || '',
    truck: row.TruckType || '',
    hic_time: row.HIC_ASN_Time || '',
    pickup: row.PickUpDate || '',
    eta: row.ExpectedArriveDate || '',
    ata: row.ActualArriveDate || '',
    status: row.Status || '',
    supplier: row.Supplier || '',
    city: row.PickCity || '',
    qty: row.Quantity || '',
    type: row.TransportType || ''
  })).filter(r => r.bol);
}

// ===== Load data from relative CSV paths =====
async function loadData() {
  showLoading('正在加载数据...');
  DATA = [];
  idgCount = 0; isgCount = 0;
  let errors = [];

  for (const file of CSV_FILES) {
    try {
      const resp = await fetch(file.url + '?t=' + Date.now()); // cache bust
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const text = await resp.text();
      const records = parseCSV(text, file.source);
      DATA.push(...records);
      if (file.source === 'IDG') idgCount = records.length;
      else isgCount = records.length;
    } catch (e) {
      errors.push(file.source + ': ' + e.message);
      console.warn(`Failed to load ${file.url}:`, e);
    }
  }

  lastLoadTime = new Date();
  hideLoading();
  updateUI(errors);
}

// ===== UI Updates =====
function updateUI(errors) {
  const btn = document.getElementById('searchBtn');
  const dotI = document.getElementById('dotIndicator');
  const lbl = document.getElementById('toggleLabel');
  const info = document.getElementById('panelInfo');
  const dIDG = document.getElementById('dotIDG');
  const dISG = document.getElementById('dotISG');
  const cIDG = document.getElementById('countIDG');
  const cISG = document.getElementById('countISG');

  dIDG.className = 'dot ' + (idgCount ? 'ok' : (errors && errors.some(e => e.startsWith('IDG')) ? 'err' : 'none'));
  dISG.className = 'dot ' + (isgCount ? 'ok' : (errors && errors.some(e => e.startsWith('ISG')) ? 'err' : 'none'));
  cIDG.textContent = idgCount ? idgCount + ' 条' : '-';
  cISG.textContent = isgCount ? isgCount + ' 条' : '-';

  if (DATA.length) {
    dotI.className = 'dot-indicator ' + (idgCount && isgCount ? 'ready' : 'partial');
    lbl.textContent = DATA.length + ' 条已加载';
    btn.disabled = false;
    const t = lastLoadTime ? lastLoadTime.toLocaleString('zh-CN', { hour: '2-digit', minute: '2-digit' }) : '';
    info.innerHTML = `共 <span class="time">${DATA.length}</span> 条记录 | 加载时间: <span class="time">${t}</span>`;
  } else {
    dotI.className = 'dot-indicator';
    lbl.textContent = '加载失败';
    btn.disabled = true;
    info.textContent = '数据加载失败，请检查CSV文件是否存在';
  }
}

// ===== Loading UI =====
function showLoading(msg) { const el = document.getElementById('loading'); el.style.display = 'flex'; document.getElementById('loadingText').textContent = msg || '加载中...' }
function hideLoading() { document.getElementById('loading').style.display = 'none' }

// ===== Init =====
loadData();

// ===== Event: Toggle panel =====
document.getElementById('toggleUpload').addEventListener('click', e => {
  e.stopPropagation();
  document.getElementById('uploadPanel').classList.toggle('show');
});
document.addEventListener('click', e => {
  const panel = document.getElementById('uploadPanel');
  if (panel.classList.contains('show') && !panel.contains(e.target) && !document.getElementById('toggleUpload').contains(e.target)) panel.classList.remove('show');
});

// ===== Event: Refresh button =====
document.getElementById('refreshBtn').addEventListener('click', () => loadData());

// ===== Event: Search =====
document.getElementById('searchBtn').addEventListener('click', doSearch);
document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !document.getElementById('searchBtn').disabled) doSearch() });

function doSearch() {
  const val = document.getElementById('searchInput').value.trim().toLowerCase();
  if (!val) { alert('请输入BOL号码'); return }
  currentResults = DATA.filter(r => r.bol.toLowerCase().includes(val));
  currentPage = 1;
  renderResults();
}

function renderResults() {
  const sec = document.getElementById('resultSection'), no = document.getElementById('noResult');
  if (!currentResults.length) { sec.style.display = 'none'; no.style.display = 'block'; return }
  no.style.display = 'none'; sec.style.display = 'block';
  document.getElementById('resultCount').textContent = `查询结果：共 ${currentResults.length} 条记录`;
  const start = (currentPage - 1) * PAGE_SIZE, page = currentResults.slice(start, start + PAGE_SIZE);
  document.getElementById('resultBody').innerHTML = page.map(r => {
    const sc = (r.status || '').toLowerCase() === 'close' ? 'status-close' : (r.status || '').toLowerCase() === 'open' ? 'status-open' : '';
    return `<tr><td>${esc(r.src)}</td><td>${esc(r.bol)}</td><td class="${sc}">${esc(r.status)}</td><td>${esc(r.carrier)}</td><td>${esc(r.truck)}</td><td>${esc(r.hic_time)}</td><td>${esc(r.pickup)}</td><td>${esc(r.eta)}</td><td>${esc(r.ata)}</td><td>${esc(r.supplier)}</td><td>${esc(r.city)}</td><td>${esc(r.qty)}</td><td>${esc(r.type)}</td></tr>`;
  }).join('');
  renderPagination();
}

function renderPagination() {
  const total = Math.ceil(currentResults.length / PAGE_SIZE);
  if (total <= 1) { document.getElementById('pagination').innerHTML = ''; return }
  let h = `<button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="goPage(${currentPage - 1})">上一页</button>`;
  const rng = [], s = Math.max(1, currentPage - 2), e = Math.min(total, currentPage + 2);
  if (s > 1) { rng.push(1); if (s > 2) rng.push('...') }
  for (let i = s; i <= e; i++) rng.push(i);
  if (e < total) { if (e < total - 1) rng.push('...'); rng.push(total) }
  rng.forEach(p => { h += p === '...' ? `<span class="page-btn" style="border:none;cursor:default">...</span>` : `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="goPage(${p})">${p}</button>` });
  h += `<button class="page-btn" ${currentPage === total ? 'disabled' : ''} onclick="goPage(${currentPage + 1})">下一页</button>`;
  document.getElementById('pagination').innerHTML = h;
}
function goPage(p) { currentPage = p; renderResults(); document.querySelector('.table-wrapper').scrollTop = 0 }
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML }

// ===== Export CSV =====
document.getElementById('exportBtn').addEventListener('click', function () {
  if (!currentResults.length) return;
  const hd = ['来源', 'BOL Number', '货物状态', '承运商', 'Truck Type', 'HIC ASN收到时间', '提货时间', '预计到达时间', '实际到达时间', '供应商', '提货城市', '数量', '运输类型'];
  const ks = ['src', 'bol', 'status', 'carrier', 'truck', 'hic_time', 'pickup', 'eta', 'ata', 'supplier', 'city', 'qty', 'type'];
  let csv = '\uFEFF' + hd.join(',') + '\n';
  currentResults.forEach(r => { csv += ks.map(k => `"${(r[k] || '').replace(/"/g, '""')}"`).join(',') + '\n' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'logistics_query_result.csv'; a.click();
});
</script>
</body>
</html>
